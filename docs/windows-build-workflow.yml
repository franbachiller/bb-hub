name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: controller-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: controller-electron/package-lock.json
      - run: npm ci
      - run: npm run dist
      - name: Hash installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter 'BB Hub Setup *.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $installer.DirectoryName 'SHA256.txt'), "$hash  $($installer.Name)`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: BB-Hub-Windows-x64
          path: |
            controller-electron/dist/BB Hub Setup *.exe
            controller-electron/dist/SHA256.txt
          retention-days: 30
